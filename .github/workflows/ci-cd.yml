name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Verify production build
        run: |
          test -f dist/index.html
          echo "Production build found successfully."

      - name: Build Docker image
        run: |
          docker build -t caterpillar-gallery .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker tag caterpillar-gallery "$DOCKER_USERNAME/caterpillar-gallery:latest"
          docker push "$DOCKER_USERNAME/caterpillar-gallery:latest"

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::734320146457:role/GitHubActions-CaterpillarGallery
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to ECS
        if: github.event_name == 'push'
        run: |
          aws ecs update-service \
            --cluster caterpillar-gallery-cluster \
            --service caterpillar-gallery-service \
            --force-new-deployment
