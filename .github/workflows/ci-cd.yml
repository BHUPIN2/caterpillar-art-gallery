name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Verify production build
        run: |
          test -f dist/index.html
          echo "Production build found successfully."

      - name: Build Docker image
        run: docker build -t caterpillar-gallery .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag caterpillar-gallery ${{ secrets.DOCKER_USERNAME }}/caterpillar-gallery:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/caterpillar-gallery:latest